<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#222">Step Pendulum — схема подключения</text>
  <text x="600" y="78" text-anchor="middle" font-size="15" fill="#666">Вид на плату сверху (сторона с чипом), разъём USB-C вверху. Сверяйтесь с надписями выводов на своей плате.</text>

  <!-- ===================== ESP32-C3 SuperMini ===================== -->
  <text x="550" y="122" text-anchor="middle" font-size="17" font-weight="700" fill="#222">ESP32-C3 SuperMini</text>
  <rect x="510" y="138" width="80" height="40" rx="10" fill="#b8bec6" stroke="#6b7280" stroke-width="2"/>
  <rect x="524" y="150" width="52" height="14" rx="7" fill="#4b5563"/>
  <text x="502" y="162" text-anchor="end" font-size="12" fill="#555">USB-C (питание 5 В)</text>
  <rect x="420" y="170" width="260" height="335" rx="14" fill="#1f3550" stroke="#0f1d2e" stroke-width="3"/>
  <rect x="522" y="292" width="56" height="56" rx="4" fill="#111" stroke="#444"/>
  <text x="550" y="317" text-anchor="middle" font-size="9" fill="#ddd">ESP32</text>
  <text x="550" y="330" text-anchor="middle" font-size="9" fill="#ddd">-C3</text>
  <rect x="520" y="200" width="18" height="12" rx="2" fill="#e5e7eb"/>
  <rect x="562" y="200" width="18" height="12" rx="2" fill="#e5e7eb"/>
  <text x="529" y="226" text-anchor="middle" font-size="8" fill="#cbd5e1">BOOT</text>
  <text x="571" y="226" text-anchor="middle" font-size="8" fill="#cbd5e1">RST</text>
  <rect x="541" y="372" width="18" height="10" rx="2" fill="#60a5fa" stroke="#bfdbfe"/>
  <text x="550" y="396" text-anchor="middle" font-size="9" fill="#bfdbfe">LED (GPIO8)</text>
  <rect x="520" y="440" width="60" height="22" rx="3" fill="#d6c7a1"/>
  <text x="550" y="478" text-anchor="middle" font-size="9" fill="#cbd5e1">антенна</text>

  <g font-size="13" fill="#ffffff">
    <circle cx="445" cy="225" r="9" fill="#d4a017" stroke="#fde68a" stroke-width="3"/><text x="463" y="230" font-weight="700" fill="#fde68a">GPIO5</text>
    <circle cx="445" cy="261" r="8" fill="#b08d2c"/><text x="463" y="266">GPIO6</text>
    <circle cx="445" cy="297" r="8" fill="#b08d2c"/><text x="463" y="302">GPIO7</text>
    <circle cx="445" cy="333" r="8" fill="#b08d2c"/><text x="463" y="338">GPIO8</text>
    <circle cx="445" cy="369" r="8" fill="#b08d2c"/><text x="463" y="374">GPIO9</text>
    <circle cx="445" cy="405" r="8" fill="#b08d2c"/><text x="463" y="410">GPIO10</text>
    <circle cx="445" cy="441" r="8" fill="#b08d2c"/><text x="463" y="446">GPIO20</text>
    <circle cx="445" cy="477" r="8" fill="#b08d2c"/><text x="463" y="482">GPIO21</text>
  </g>
  <g font-size="13" fill="#ffffff" text-anchor="end">
    <circle cx="655" cy="225" r="9" fill="#d4a017" stroke="#fde68a" stroke-width="3"/><text x="637" y="230" font-weight="700" fill="#fde68a">5V</text>
    <circle cx="655" cy="261" r="9" fill="#d4a017" stroke="#fde68a" stroke-width="3"/><text x="637" y="266" font-weight="700" fill="#fde68a">GND</text>
    <circle cx="655" cy="297" r="8" fill="#b08d2c"/><text x="637" y="302">3V3</text>
    <circle cx="655" cy="333" r="9" fill="#d4a017" stroke="#fde68a" stroke-width="3"/><text x="637" y="338" font-weight="700" fill="#fde68a">GPIO4</text>
    <circle cx="655" cy="369" r="8" fill="#b08d2c"/><text x="637" y="374">GPIO3</text>
    <circle cx="655" cy="405" r="8" fill="#b08d2c"/><text x="637" y="410">GPIO2</text>
    <circle cx="655" cy="441" r="8" fill="#b08d2c"/><text x="637" y="446">GPIO1</text>
    <circle cx="655" cy="477" r="8" fill="#b08d2c"/><text x="637" y="482">GPIO0</text>
  </g>

  <!-- ===================== Wires ===================== -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- red: 5V -> servo (top) -->
    <path d="M655 225 H710 V180 H880 C925 180 920 300 962 300" stroke="#5a0000" stroke-width="9"/>
    <path d="M655 225 H710 V180 H880 C925 180 920 300 962 300" stroke="#e11d1d" stroke-width="6"/>
    <!-- brown: GND -> servo (middle) -->
    <path d="M655 261 H880 C925 261 920 313 962 313" stroke="#2a1606" stroke-width="9"/>
    <path d="M655 261 H880 C925 261 920 313 962 313" stroke="#7b4a1e" stroke-width="6"/>
    <!-- orange: GPIO4 -> resistor -> servo (bottom) -->
    <path d="M655 333 H880 C925 333 920 326 962 326" stroke="#6b3200" stroke-width="9"/>
    <path d="M655 333 H880 C925 333 920 326 962 326" stroke="#f28c1a" stroke-width="6"/>
    <!-- button signal: GPIO5 -->
    <path d="M335 315 H370 V225 H445" stroke="#14532d" stroke-width="9"/>
    <path d="M335 315 H370 V225 H445" stroke="#22c55e" stroke-width="6"/>
    <!-- button GND: joins the brown GND wire (hop over orange) -->
    <path d="M335 365 H390 V560 H720 V345 A12 12 0 0 1 720 321 V261" stroke="#2a1606" stroke-width="9"/>
    <path d="M335 365 H390 V560 H720 V345 A12 12 0 0 1 720 321 V261" stroke="#7b4a1e" stroke-width="6"/>
  </g>
  <circle cx="720" cy="261" r="7" fill="#2a1606"/>

  <!-- ===================== Resistor 1 kOhm ===================== -->
  <line x1="770" y1="333" x2="860" y2="333" stroke="#9ca3af" stroke-width="4"/>
  <rect x="786" y="321" width="58" height="24" rx="10" fill="#e9d5a6" stroke="#a78b52" stroke-width="2"/>
  <rect x="796" y="321" width="6" height="24" fill="#7b4a1e"/>
  <rect x="808" y="321" width="6" height="24" fill="#111"/>
  <rect x="820" y="321" width="6" height="24" fill="#d32f2f"/>
  <rect x="834" y="321" width="5" height="24" fill="#c9a227"/>
  <text x="815" y="368" text-anchor="middle" font-size="13" font-weight="700" fill="#333">1 кОм</text>

  <!-- ===================== Radial electrolytic capacitor (leads on one side) ===================== -->
  <!-- leads: + up to red, - down to brown -->
  <path d="M790 210 H760 V180" fill="none" stroke="#9ca3af" stroke-width="3"/>
  <path d="M790 230 H760 V261" fill="none" stroke="#9ca3af" stroke-width="3"/>
  <circle cx="760" cy="180" r="4" fill="#5a0000"/>
  <circle cx="760" cy="261" r="4" fill="#2a1606"/>
  <!-- body lying on its side, leads exit from the left end -->
  <rect x="788" y="196" width="62" height="48" rx="7" fill="#1e3a8a" stroke="#0b1d4d" stroke-width="2"/>
  <rect x="788" y="228" width="62" height="16" rx="3" fill="#93c5fd"/>
  <text x="805" y="241" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">−</text>
  <text x="832" y="241" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">−</text>
  <ellipse cx="849" cy="220" rx="4" ry="23" fill="#cbd5e1" stroke="#0b1d4d" stroke-width="1"/>
  <text x="776" y="203" text-anchor="middle" font-size="13" font-weight="700" fill="#e11d1d">+</text>
  <text x="820" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#333">470–1000 мкФ</text>

  <!-- ===================== Servo SG90 ===================== -->
  <rect x="945" y="298" width="190" height="30" rx="6" fill="#3b82f6" stroke="#1e40af" stroke-width="2" opacity="0.85"/>
  <circle cx="1124" cy="313" r="5" fill="#fff"/>
  <rect x="960" y="273" width="150" height="80" rx="8" fill="#2563eb" stroke="#1e3a8a" stroke-width="3" opacity="0.92"/>
  <circle cx="1080" cy="313" r="24" fill="#60a5fa" stroke="#1e3a8a" stroke-width="2"/>
  <rect x="1073" y="243" width="14" height="140" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="1080" cy="313" r="11" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="1080" cy="255" r="2.5" fill="#94a3b8"/><circle cx="1080" cy="267" r="2.5" fill="#94a3b8"/>
  <circle cx="1080" cy="359" r="2.5" fill="#94a3b8"/><circle cx="1080" cy="371" r="2.5" fill="#94a3b8"/>
  <text x="1015" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">SG90</text>
  <text x="1035" y="420" text-anchor="middle" font-size="17" font-weight="700" fill="#222">Сервопривод SG90</text>
  <text x="1035" y="440" text-anchor="middle" font-size="13" fill="#666">(или MG90S / MG90D)</text>
  <g font-size="14" fill="#333">
    <line x1="960" y1="470" x2="1000" y2="470" stroke="#e11d1d" stroke-width="6" stroke-linecap="round"/><text x="1010" y="475">красный — +5 В</text>
    <line x1="960" y1="496" x2="1000" y2="496" stroke="#7b4a1e" stroke-width="6" stroke-linecap="round"/><text x="1010" y="501">коричневый — GND</text>
    <line x1="960" y1="522" x2="1000" y2="522" stroke="#f28c1a" stroke-width="6" stroke-linecap="round"/><text x="1010" y="527">оранжевый — сигнал</text>
  </g>

  <!-- ===================== Tact button 6x6 ===================== -->
  <!-- left legs: melted into the clamp body -->
  <g stroke="#9ca3af" stroke-width="5" stroke-linecap="round" stroke-dasharray="4 4">
    <line x1="205" y1="315" x2="232" y2="315"/>
    <line x1="205" y1="365" x2="232" y2="365"/>
  </g>
  <!-- right legs: wired -->
  <g stroke="#9ca3af" stroke-width="5" stroke-linecap="round">
    <line x1="308" y1="315" x2="335" y2="315"/>
    <line x1="308" y1="365" x2="335" y2="365"/>
  </g>
  <rect x="230" y="300" width="80" height="80" rx="4" fill="#1f2937" stroke="#000" stroke-width="2"/>
  <rect x="238" y="308" width="64" height="64" rx="3" fill="#cbd5e1" stroke="#94a3b8"/>
  <circle cx="246" cy="316" r="5" fill="#111"/>
  <circle cx="294" cy="316" r="5" fill="#111"/>
  <circle cx="246" cy="364" r="5" fill="#111"/>
  <circle cx="294" cy="364" r="5" fill="#111"/>
  <circle cx="270" cy="340" r="18" fill="#111" stroke="#333" stroke-width="2"/>
  <circle cx="265" cy="335" r="6" fill="#374151"/>
  <text x="196" y="345" text-anchor="end" font-size="12" fill="#666">вплавить</text>
  <text x="196" y="360" text-anchor="end" font-size="12" fill="#666">в корпус</text>
  <text x="270" y="410" text-anchor="middle" font-size="17" font-weight="700" fill="#222">Кнопка 6×6</text>
  <text x="250" y="430" text-anchor="middle" font-size="13" fill="#666">провода — к ножкам с одной стороны</text>
  <text x="410" y="210" text-anchor="middle" font-size="13" fill="#15803d" font-weight="700">к GPIO5</text>
  <text x="550" y="577" text-anchor="middle" font-size="13" fill="#7b4a1e" font-weight="700">к GND (общий с сервоприводом)</text>

  <!-- ===================== Notes ===================== -->
  <rect x="40" y="600" width="1120" height="140" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <g font-size="15" fill="#333">
    <text x="64" y="632">1. Резистор 1 кОм (полосы: коричневая, чёрная, красная) ставится в разрыв оранжевого провода — он защищает вывод платы.</text>
    <text x="64" y="660">2. Конденсатор: длинный вывод «+» — к красному проводу, вывод со стороны полосы «−» — к коричневому.</text>
    <text x="64" y="688">3. Кнопка: провода припаиваются к двум ножкам с одной стороны (к GPIO5 и к GND), две другие ножки вплавляются в корпус.</text>
    <text x="64" y="716">4. Питание всей схемы — от USB-C платы (любая телефонная зарядка 5 В). Все провода GND соединяются вместе.</text>
  </g>
</svg>
